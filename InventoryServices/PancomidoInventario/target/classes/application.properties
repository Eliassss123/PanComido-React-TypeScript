server.port=8082
spring.application.name=inventory-service

# 👇 OJO: usa el nombre REAL de tu base (por ejemplo pancomido)
spring.datasource.url=jdbc:mysql://localhost:3306/pancomido?useSSL=false&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

# Deja que Hibernate cree/actualice las tablas mientras desarrollas
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Swagger (ok)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.version=1.0.0
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.docExpansion=none

# Config Server opcional
spring.config.import=optional:configserver:http://localhost:8888

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
