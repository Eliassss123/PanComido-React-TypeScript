server.port=8085
spring.application.name=gateway-service

# Desactivar Config Server en el gateway
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# ==== RUTA MINIMAL SOLO PARA PROBAR ====
spring.cloud.gateway.routes[0].id=product-direct
spring.cloud.gateway.routes[0].uri=http://localhost:8082
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/productos/**

# Logs extra
logging.level.org.springframework=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.cloud.gateway=DEBUG

# Eureka (lo puedes dejar)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
